{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · MCQ Examination Checker</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center px-3" style="min-height:100vh">
  <div class="card p-4" style="width:100%;max-width:380px">
    <h1 class="h4 page-title mb-1">MCQ Examination Checker</h1>
    <p class="text-secondary small mb-4">Sign in to continue.</p>
    {% if form.errors %}<div class="alert alert-danger py-2 small">Invalid username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_username">Username</label>
        <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="id_password">Password</label>
        <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</body>
</html>
