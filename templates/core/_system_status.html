<div class="card">
  <div class="card-header">System status</div>
  <ul class="list-group list-group-flush">
    {% for c in checks %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span><i class="bi {% if c.ok %}bi-check-circle-fill text-success{% else %}bi-x-circle-fill text-danger{% endif %} me-2"></i>{{ c.name }}</span>
        <span class="small text-secondary text-truncate ms-3" style="max-width:60%">{{ c.detail }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
